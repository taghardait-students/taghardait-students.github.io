<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مكتب الطلبة الجامعيين المزابيين لقصر تغردايت بالعاصمة</title>
  <meta name="description" content="مكتب الطلبة الجامعيين المزابيين لقصر تغردايت بالجزائر العاصمة: وسائل التواصل، البرامج، والفعاليات.">
  <meta property="og:title" content="مكتب الطلبة الجامعيين المزابيين لقصر تغردايت بالعاصمة">
  <meta property="og:description" content="تواصل معنا واكتشف برامجنا وفعالياتنا.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#2A0B2C">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <header class="hero">
    <div class="wrap">
      <div class="logo" id="logo"></div>
      <h1 id="name"></h1>
      <div class="sub" id="subname"></div>
      <p class="tagline" id="tagline"></p>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <main class="wrap">
    <div class="contact-card">
      <div id="wa"></div>
      <div class="socials" id="socials"></div>
    </div>

    <section id="programs">
      <h2 class="sec-title">برامجنا وفعالياتنا</h2>
      <p class="sec-lead">اضغط على أي برنامج لقراءة التقرير الكامل ومشاهدة الصور.</p>
      <div class="events" id="events"></div>
    </section>

    <section class="about">
      <h2 class="sec-title">من نحن</h2>
      <div class="group-photo" id="groupPhoto"></div>
      <div id="about"></div>
      <p class="scope" id="scope"></p>
    </section>

    <section>
      <div class="vm">
        <div class="vm-card vision"><h3>رؤيتنا</h3><p id="vision"></p></div>
        <div class="vm-card mission"><h3>رسالتنا</h3><p id="mission"></p></div>
      </div>
    </section>

    <section>
      <h2 class="sec-title">مجالات عملنا</h2>
      <ol class="goals" id="goals"></ol>
    </section>

    <section>
      <h2 class="sec-title">قيمنا</h2>
      <p class="sec-lead swipe-hint">اسحب لرؤية كل القيم ←</p>
      <div class="values" id="values"></div>
    </section>

    <section class="join-band">
      <h2>طالب جديد من تغردايت؟</h2>
      <p>عرّفنا بنفسك في رسالة واحدة، ونتواصل معك.</p>
      <div id="join2"></div>
    </section>
  </main>

  <footer>© <span id="year"></span> مكتب الطلبة الجامعيين المزابيين لقصر تغردايت بالعاصمة</footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
